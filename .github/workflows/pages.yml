name: Validate and deploy archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js for reader export verification
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check OpenPGP verifier for signed source inputs
        run: gpg --version
      - name: Rebuild source-backed readers and validate offline site
        run: |
          python build_release.py
      - name: Verify package checksums
        run: python -B verify_archive_manifest.py
      - name: Run Python archive checks
        run: python -B run_tests.py
      - name: Run browser package and offline checks
        run: |
          node --check app.js
          node --check offline-reader-cache.js
          node --check sw.js
          node tests/test_reader_package.js
          node tests/test_offline_reader_cache.js
          node tests/test_service_worker.js
      - name: Check responsive reading and offline use in Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/browser_smoke.cjs
      - name: Require committed build outputs to match source evidence
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "::error::Generated archive files are stale. Run the source-backed rebuild commands in README.md and commit the results."
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Python for site packaging
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Stage canonical public site
        run: python -B build_upload_package.py --site-only
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
