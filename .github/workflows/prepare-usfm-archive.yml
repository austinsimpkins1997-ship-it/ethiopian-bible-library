name: Prepare verified USFM archive
on:
  push:
    branches: [codex/prepare-usfm-word-fix]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'austinsimpkins1997-ship-it/ethiopian-bible-library' && github.ref == 'refs/heads/codex/prepare-usfm-word-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/prepare-usfm-word-fix
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Rebuild retained sources and verify the exact tested archive
        run: |
          python build_release.py
          python -B verify_archive_manifest.py
          test "$(git hash-object archive.json)" = "5b2f279e9916b16c144e6182d9dd1dd83f7bd305"
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"archive.json","archive-manifest.json"}
          if not changed.issubset(allowed):
              raise SystemExit("Unexpected generated changes: "+repr(sorted(changed-allowed)))
          PY
      - name: Commit only the verified generated files to this preparation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- archive.json archive-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare exact verified USFM word-attribute archive"
          git push origin HEAD:refs/heads/codex/prepare-usfm-word-fix
