<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123a31">
  <title>Offline reader unavailable</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8f5ec; color: #173c33; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 38rem; padding: 2rem; }
    h1 { font: 600 clamp(1.6rem, 6vw, 2.3rem)/1.2 Georgia, serif; }
    p { line-height: 1.7; }
    a { color: #125b49; }
  </style>
</head>
<body>
  <main>
    <h1>Reader not stored for offline use</h1>
    <p>This device could not find a saved copy of the library page. Connect to the internet and open the reader once to store it for offline use. If browser storage is full, free some space and reopen the page.</p>
    <p><a href="index.html">Try the library again</a></p>
  </main>
</body>
</html>
